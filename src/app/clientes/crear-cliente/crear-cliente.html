<div class="container">
  <h2>Crear Cliente</h2>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <mat-form-field appearance="fill" class="campo-form">
      <input matInput formControlName="nombres" placeholder="Nombres">
      <mat-error>{{ obtenerMensajeError('nombres') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="campo-form">
      <input matInput formControlName="apellidos" placeholder="Apellidos">
      <mat-error>{{ obtenerMensajeError('apellidos') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="campo-form">
      <input matInput formControlName="cedula" placeholder="Cédula / RUC">
      <mat-error>{{ obtenerMensajeError('cedula') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="campo-form">
      <input matInput type="email" formControlName="email" placeholder="Correo Electrónico">
      <mat-error>{{ obtenerMensajeError('email') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="campo-form">
      <input matInput formControlName="telefono" placeholder="Teléfono">
      <mat-error>{{ obtenerMensajeError('telefono') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="campo-form">
      <input matInput formControlName="direccion" placeholder="Dirección">
      <mat-error>{{ obtenerMensajeError('direccion') }}</mat-error>
    </mat-form-field>

    <div class="acciones">
      <button 
        type="submit"
        class="btn-aceptar" 
        [disabled]="form.invalid">
        Aceptar
      </button>

      <button 
        type="button"
        class="btn-cancelar" 
        routerLink="/listarClientes">
        Cancelar
      </button>
    </div>
  </form>
</div>
