<div class="container">
  <h2>Crear Producto</h2>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Código</mat-label>
      <input matInput formControlName="codigo" placeholder="Ej. 002">
      <mat-error>{{ obtenerMensajeError('codigo') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" placeholder="Nombre del producto">
      <mat-error>{{ obtenerMensajeError('nombre') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Descripción</mat-label>
      <textarea matInput formControlName="descripcion" placeholder="Descripción breve"></textarea>
      <mat-error>{{ obtenerMensajeError('descripcion') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Precio Unitario</mat-label>
      <input matInput type="number" formControlName="precioUnitario" placeholder="0.50" step="0.01">
      <mat-error>{{ obtenerMensajeError('precioUnitario') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Cantidad</mat-label>
      <input matInput type="number" formControlName="cantidad" placeholder="4">
      <mat-error>{{ obtenerMensajeError('cantidad') }}</mat-error>
    </mat-form-field>

    <div class="separacion">
      <button 
        type="submit"
        mat-flat-button 
        color="primary" 
        [disabled]="form.invalid">
        Aceptar
      </button>

      <button 
        type="button"
        mat-flat-button 
        style="background-color: red; color: white; margin-left: 10px;" 
        routerLink="/listarProductos">
        Cancelar
      </button>
    </div>
  </form>
</div>
