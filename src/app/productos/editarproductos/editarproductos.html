<section class="editar-contenedor">
  <h2>Actualizar Producto</h2>

  <form [formGroup]="productoForm" (ngSubmit)="guardar()" class="formulario-producto">
    <div class="campo">
      <input type="text" formControlName="codigo" placeholder="Código" />
    </div>

    <div class="campo">
      <input type="text" formControlName="nombre" placeholder="Nombre" />
    </div>

    <div class="campo">
      <input type="text" formControlName="descripcion" placeholder="Descripción" />
    </div>

    <div class="campo">
      <input type="number" formControlName="precioUnitario" placeholder="Precio Unitario" />
    </div>

    <div class="campo">
      <input type="number" formControlName="cantidad" placeholder="Cantidad" />
    </div>

    <div class="acciones-form">
      <button type="submit" class="btn-aceptar" [disabled]="productoForm.invalid">Aceptar</button>
      <a class="btn-cancelar" routerLink="/listarProductos">Cancelar</a>
    </div>
  </form>
</section>
