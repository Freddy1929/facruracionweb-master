<section class="editar-contenedor">
  <h2>Actualizar Producto</h2>

  <form class="formulario-producto">
    <div class="campo">
      <input type="text" placeholder="Código" />
    </div>

    <div class="campo">
      <input type="text" placeholder="Nombre" />
    </div>

    <div class="campo">
      <input type="text" placeholder="Descripción" />
    </div>

    <div class="campo">
      <input type="text" placeholder="Precio Unitario" />
    </div>

    <div class="campo">
      <input type="text" placeholder="Cantidad" />
    </div>

    <div class="acciones-form">
      <button matButton="filled" type="button" class="btn-aceptar">Aceptar</button>
      <a matButton="filled" class="btn-cancelar" routerLink="/listarProductos">Cancelar</a>
    </div>
  </form>
</section>
